        function addLog(text, type = '') {
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            div.textContent = text;
            logEl.prepend(div);
        }

        async function startSeeding() {
            startBtn.disabled = true;
            startBtn.textContent = '⏳ চলছে...';
            let success = 0;
            let skipped = 0;
            let failed = 0;

            statusEl.textContent = '🔍 ডাটাবেস চেক করা হচ্ছে...';
            addLog('ডাটাবেস চেক করা হচ্ছে...', '');

            let existingNames = new Set();
            try {
                const snap = await db.collection('mosques').get();
                snap.forEach(doc => existingNames.add(doc.data().name));
                addLog(`ডাটাবেসে ইতোমধ্যে ${existingNames.size}টি মসজিদ আছে`, '');
            } catch (e) {
                addLog('ডাটাবেস চেক করতে সমস্যা: ' + e.message, 'error');
            }

            for (let i = 0; i < mosques.length; i++) {
                const m = mosques[i];
                const pct = Math.round(((i + 1) / mosques.length) * 100);
                progressEl.style.width = pct + '%';
                progressEl.textContent = pct + '%';
                statusEl.textContent = `📍 ${i + 1}/${mosques.length}: ${m.name}`;

                if (existingNames.has(m.name)) {
                    addLog(`⏭️ ${m.name} — ইতোমধ্যে আছে`, '');
                    skipped++;
                    continue;
                }

                try {
                    await db.collection('mosques').add({
                        name: m.name,
                        area: m.area,
                        address: m.address,
                        addedBy: "সিস্টেম (অটো সিড)",
                        addedByPhone: "01700000000",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    addLog(`✅ ${m.name} (${m.area})`, 'success');
                    success++;
                } catch (err) {
                    addLog(`❌ ${m.name} — ${err.message}`, 'error');
                    failed++;
                }

                await new Promise(r => setTimeout(r, 100));
            }

            progressEl.style.width = '100%';
            progressEl.textContent = '100%';
            statusEl.textContent = '🎉 সম্পন্ন!';
            addLog(`🎉 সম্পন্ন! ✅ ${success} যোগ হয়েছে | ⏭️ ${skipped} স্কিপ | ❌ ${failed} ব্যর্থ`, 'done');
            
            startBtn.textContent = '✅ সম্পন্ন হয়েছে!';
            startBtn.style.background = 'linear-gradient(135deg, #f59e0b, #f97316)';
        }

        async function deleteAll() {
            if (!confirm('⚠️ সতর্কতা!\n\nডাটাবেসের সব মসজিদ এবং বিরিয়ানি পোস্ট ডিলিট হয়ে যাবে। আপনি কি নিশ্চিত?')) return;
            if (!confirm('🚨 আবার নিশ্চিত হচ্ছেন? এটি আর ফিরিয়ে আনা যাবে না!')) return;
            
            addLog('🗑️ সব মসজিদ ডিলিট করা হচ্ছে...', 'error');
            statusEl.textContent = '🗑️ ডিলিট চলছে...';
            
            try {
                const [mosquesSnap, postsSnap] = await Promise.all([
                    db.collection('mosques').get(),
                    db.collection('biriyaniPosts').get()
                ]);
                
                const batch = db.batch();
                mosquesSnap.forEach(doc => batch.delete(doc.ref));
                postsSnap.forEach(doc => batch.delete(doc.ref));
                
                await batch.commit();
                
                addLog(`✅ ${mosquesSnap.size}টি মসজিদ এবং ${postsSnap.size}টি পোস্ট ডিলিট হয়েছে`, 'done');
                statusEl.textContent = '✅ সব কিছু ডিলিট হয়েছে';
            } catch (e) {
                addLog('❌ ডিলিট ব্যর্থ: ' + e.message, 'error');
            }
        }
    </script>
